spring.application.name=ReVueltaBack

# ===== Base de datos H2 =====
# Hay dos opciones. Deja activa UNA sola (la otra comentada).

# --- Opcion 1: EN MEMORIA (volatil) ---
# Vive en la RAM del proceso. Se borra TODO al apagar la app. Ideal para empezar limpio.
# Herramientas externas NO pueden conectarse a esta BD.
# spring.datasource.url=jdbc:h2:mem:revuelta;DB_CLOSE_DELAY=-1

# --- Opcion 2: EN ARCHIVO (persistente) [ACTIVA] ---
# Se guarda en ./data/revuelta.mv.db. Los datos persisten al apagar la app.
# AUTO_SERVER=TRUE permite que herramientas externas (DBeaver, SchemaSpy) se conecten
# a la vez que la app esta corriendo.
spring.datasource.url=jdbc:h2:file:./data/revuelta;AUTO_SERVER=TRUE

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Consola web de H2 =====
# Disponible en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
